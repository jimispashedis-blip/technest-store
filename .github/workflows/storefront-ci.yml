name: Storefront CI

on:
  push:
    branches: [main]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront-ci.yml"
  pull_request:
    paths:
      - "storefront/**"
      - ".github/workflows/storefront-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: storefront

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: "2025-10"
